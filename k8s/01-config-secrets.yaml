apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-parking-config
  namespace: smart-parking
data:
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "smart_parking"
  MYSQL_USER: "parking_user"
  MYSQL_AI_USER: "ai_reader"
  REDIS_URL: "redis://redis:6379/0"
  AI_SERVICE_URL: "http://ai-service:8001"
  BACKEND_PORT: "8000"
  AI_PORT: "8001"
  AI_SERVICE_TIMEOUT_SECS: "2"
  JWT_ACCESS_MINUTES: "15"
  JWT_REFRESH_DAYS: "7"
  JWT_ALGORITHM: "HS256"
  HOLD_MINUTES: "10"
  MIN_DURATION_MINUTES: "30"
  MAX_DURATION_HOURS: "24"
  BOOKING_GRANULARITY_MINUTES: "15"
  PER_USER_PENDING_LIMIT: "3"
  APP_NAME: "SmartParking"
  FRONTEND_URL: "http://smartparking.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: smart-parking-secrets
  namespace: smart-parking
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_PASSWORD: "parking_pass"
  MYSQL_AI_PASSWORD: "ai_reader_pass"
  JWT_SECRET: "k8s-prod-super-secret-jwt-key-32bytes-min"
  RAZORPAY_KEY_ID: "rzp_test_placeholder"
  RAZORPAY_KEY_SECRET: "rzp_test_secret_placeholder"
  RAZORPAY_WEBHOOK_SECRET: "rzp_webhook_secret_placeholder"
  AI_SERVICE_TOKEN: "internal-ai-service-token-k8s"
