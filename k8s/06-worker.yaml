apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: smart-parking
  labels:
    app: worker
    tier: background
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        tier: background
    spec:
      containers:
        - name: worker
          image: smartparking-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secrets
                  key: MYSQL_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: REDIS_URL
            - name: HOLD_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: HOLD_MINUTES
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
