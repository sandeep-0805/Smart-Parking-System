apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: smart-parking
  labels:
    app: backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
        - name: backend
          image: smartparking-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secrets
                  key: MYSQL_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secrets
                  key: JWT_SECRET
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: AI_SERVICE_URL
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secrets
                  key: AI_SERVICE_TOKEN
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secrets
                  key: RAZORPAY_KEY_ID
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secrets
                  key: RAZORPAY_KEY_SECRET
            - name: HOLD_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: HOLD_MINUTES
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smart-parking
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: smart-parking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
