apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: smart-parking
  labels:
    app: ai-service
    tier: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        tier: ml
    spec:
      containers:
        - name: ai-service
          image: smartparking-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_DATABASE
            - name: MYSQL_AI_USER
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-config
                  key: MYSQL_AI_USER
            - name: MYSQL_AI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secrets
                  key: MYSQL_AI_PASSWORD
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secrets
                  key: AI_SERVICE_TOKEN
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: smart-parking
  labels:
    app: ai-service
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: ai-service
